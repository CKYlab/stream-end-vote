<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配信終了投票くん Overlay</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
    }

    .overlay {
      position: fixed;
      right: 32px;
      bottom: 32px;
      width: 360px;
      color: #f8fafc;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .overlay.hidden {
      opacity: 0;
      transform: translateY(8px);
    }

    .panel {
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(17, 24, 39, 0.78);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
    }

    .title {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 800;
    }

    .counts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .count {
      padding: 10px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.09);
    }

    .label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: #cbd5e1;
    }

    .number {
      display: block;
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
    }

    .end .number {
      color: #fb7185;
    }

    .continue .number {
      color: #5eead4;
    }

    .meter {
      height: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
    }

    .bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #fb7185, #facc15);
      transition: width 220ms ease;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      color: #dbeafe;
      font-size: 14px;
      line-height: 1.35;
    }

    .decision {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(251, 113, 133, 0.18);
      color: #ffe4e6;
      font-weight: 800;
      text-align: center;
    }

    .decision.wait {
      background: rgba(94, 234, 212, 0.14);
      color: #ccfbf1;
    }

    .countdown {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      width: min(760px, 90vw);
      max-width: 90vw;
      max-height: 90vh;
      overflow: hidden;
      padding: clamp(16px, 4vh, 36px) clamp(18px, 4vw, 40px);
      border: 2px solid rgba(251, 113, 133, 0.65);
      border-radius: 14px;
      background: rgba(17, 24, 39, 0.92);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
      color: #f8fafc;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      overflow-wrap: break-word;
    }

    .countdown[hidden] {
      display: none;
    }

    .countdown.cancelled {
      border-color: rgba(94, 234, 212, 0.65);
    }

    .countdown.stopped {
      border-color: rgba(148, 163, 184, 0.65);
    }

    .countdown.failed {
      border-color: rgba(250, 204, 21, 0.8);
    }

    .countdown-title {
      margin: 0 0 14px;
      font-size: clamp(24px, 5vw, 42px);
      line-height: 1.2;
      font-weight: 900;
      color: #fb7185;
    }

    .countdown.cancelled .countdown-title {
      color: #5eead4;
    }

    .countdown.stopped .countdown-title {
      color: #cbd5e1;
    }

    .countdown.failed .countdown-title {
      color: #facc15;
    }

    .countdown-main {
      margin: 0 0 12px;
      font-size: clamp(28px, 6.5vw, 54px);
      line-height: 1.2;
      font-weight: 900;
    }

    .countdown-sub {
      margin: 0 0 10px;
      font-size: clamp(16px, 3.2vw, 26px);
      font-weight: 700;
      color: #fde68a;
      overflow-wrap: anywhere;
    }

    .countdown-note {
      margin: 0;
      font-size: clamp(13px, 2.2vw, 18px);
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <main id="overlay" class="overlay">
    <section class="panel" aria-label="配信終了投票">
      <h1 class="title">配信終了投票</h1>
      <div class="counts">
        <div class="count end">
          <span class="label">!寝ろ / !終了</span>
          <span id="endVotes" class="number">0</span>
        </div>
        <div class="count continue">
          <span class="label">!続行 / !まだ</span>
          <span id="continueVotes" class="number">0</span>
        </div>
      </div>
      <div class="meter" aria-hidden="true">
        <div id="bar" class="bar"></div>
      </div>
      <div class="meta">
        <span id="rate">終了率 0%</span>
        <span id="validVotes">有効 0票</span>
      </div>
      <div id="decision" class="decision wait">集計中</div>
    </section>
  </main>

  <section id="countdown" class="countdown" hidden aria-label="配信終了カウントダウン">
    <h2 id="countdownTitle" class="countdown-title">終了ライン到達</h2>
    <p id="countdownMain" class="countdown-main">30秒後に配信終了予定</p>
    <p id="countdownSub" class="countdown-sub">キャンセル可能</p>
    <p id="countdownNote" class="countdown-note">※OBS停止は設定OFF時は実行されません</p>
  </section>

  <script>
    const overlay = document.getElementById("overlay");
    const endVotes = document.getElementById("endVotes");
    const continueVotes = document.getElementById("continueVotes");
    const validVotes = document.getElementById("validVotes");
    const rate = document.getElementById("rate");
    const bar = document.getElementById("bar");
    const decision = document.getElementById("decision");
    const countdown = document.getElementById("countdown");
    const countdownTitle = document.getElementById("countdownTitle");
    const countdownMain = document.getElementById("countdownMain");
    const countdownSub = document.getElementById("countdownSub");
    const countdownNote = document.getElementById("countdownNote");

    function percent(value) {
      return Math.round((Number(value) || 0) * 100);
    }

    function render(state) {
      const endRate = percent(state.end_rate);
      overlay.classList.toggle("hidden", state.visible === false);
      endVotes.textContent = state.end_votes || 0;
      continueVotes.textContent = state.continue_votes || 0;
      validVotes.textContent = `有効 ${state.valid_votes || 0}票`;
      rate.textContent = `終了率 ${endRate}%`;
      bar.style.width = `${Math.max(0, Math.min(100, endRate))}%`;

      const minimumVotes = state.minimum_votes || 0;
      const threshold = percent(state.end_rate_threshold);
      if (state.threshold_met) {
        decision.classList.remove("wait");
        decision.textContent = "終了ライン到達";
      } else {
        decision.classList.add("wait");
        decision.textContent = `${minimumVotes}票以上 / ${threshold}%で終了ライン`;
      }

      renderCountdown(state);
    }

    function renderCountdown(state) {
      const mode = state.mode || "normal";
      if (mode === "normal" || state.visible === false) {
        countdown.hidden = true;
        return;
      }

      countdown.hidden = false;
      countdown.classList.toggle("cancelled", mode === "cancelled");
      countdown.classList.toggle("stopped", mode === "stopped");
      countdown.classList.toggle("failed", mode === "stop_failed");

      const stopEnabled = state.stop_streaming_enabled === true;

      if (mode === "countdown") {
        const remaining = Math.max(0, Number(state.countdown_remaining) || 0);
        countdownTitle.textContent = "終了ライン到達";
        countdownMain.textContent = `${remaining}秒後に配信終了予定`;
        countdownSub.textContent = state.can_cancel ? "キャンセル可能" : "";
        countdownNote.textContent = stopEnabled
          ? "OBS停止がONです"
          : "※OBS停止はOFFのため実際には停止しません";
      } else if (mode === "cancelled") {
        countdownTitle.textContent = "キャンセルされました";
        countdownMain.textContent = "配信は継続します";
        countdownSub.textContent = "";
        countdownNote.textContent = "";
      } else if (mode === "would_stop") {
        countdownTitle.textContent = "終了ライン到達";
        countdownMain.textContent = "ここで停止予定です";
        countdownSub.textContent = "OBS停止はOFFです";
        countdownNote.textContent = "（実際には停止しません）";
      } else if (mode === "stopping") {
        countdownTitle.textContent = "終了ライン到達";
        countdownMain.textContent = "OBSへ停止要求中";
        countdownSub.textContent = "";
        countdownNote.textContent = "";
      } else if (mode === "stopped") {
        countdownTitle.textContent = "配信停止";
        countdownMain.textContent = "配信停止を実行しました";
        countdownSub.textContent = "";
        countdownNote.textContent = "";
      } else if (mode === "stop_failed") {
        countdownTitle.textContent = "配信停止に失敗しました";
        countdownMain.textContent = "配信は継続しています";
        countdownSub.textContent = String(state.stop_error || "原因不明").slice(0, 60);
        countdownNote.textContent = "";
      }
    }

    async function loadState() {
      try {
        const response = await fetch(`overlay_state.json?ts=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        render(await response.json());
      } catch (error) {
        decision.classList.add("wait");
        decision.textContent = "overlay_state.json待機中";
      }
    }

    loadState();
    setInterval(loadState, 1000);
  </script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amemiya End Vote Overlay</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
    }

    .overlay {
      position: fixed;
      right: 32px;
      bottom: 32px;
      width: 360px;
      color: #f8fafc;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .overlay.hidden {
      opacity: 0;
      transform: translateY(8px);
    }

    .panel {
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(17, 24, 39, 0.78);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
    }

    .title {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 800;
    }

    .counts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .count {
      padding: 10px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.09);
    }

    .label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: #cbd5e1;
    }

    .number {
      display: block;
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
    }

    .end .number {
      color: #fb7185;
    }

    .continue .number {
      color: #5eead4;
    }

    .meter {
      height: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
    }

    .bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #fb7185, #facc15);
      transition: width 220ms ease;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      color: #dbeafe;
      font-size: 14px;
      line-height: 1.35;
    }

    .decision {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(251, 113, 133, 0.18);
      color: #ffe4e6;
      font-weight: 800;
      text-align: center;
    }

    .decision.wait {
      background: rgba(94, 234, 212, 0.14);
      color: #ccfbf1;
    }
  </style>
</head>
<body>
  <main id="overlay" class="overlay">
    <section class="panel" aria-label="配信終了投票">
      <h1 class="title">配信終了投票</h1>
      <div class="counts">
        <div class="count end">
          <span class="label">!寝ろ / !終了</span>
          <span id="endVotes" class="number">0</span>
        </div>
        <div class="count continue">
          <span class="label">!続行 / !まだ</span>
          <span id="continueVotes" class="number">0</span>
        </div>
      </div>
      <div class="meter" aria-hidden="true">
        <div id="bar" class="bar"></div>
      </div>
      <div class="meta">
        <span id="rate">終了率 0%</span>
        <span id="validVotes">有効 0票</span>
      </div>
      <div id="decision" class="decision wait">集計中</div>
    </section>
  </main>

  <script>
    const overlay = document.getElementById("overlay");
    const endVotes = document.getElementById("endVotes");
    const continueVotes = document.getElementById("continueVotes");
    const validVotes = document.getElementById("validVotes");
    const rate = document.getElementById("rate");
    const bar = document.getElementById("bar");
    const decision = document.getElementById("decision");

    function percent(value) {
      return Math.round((Number(value) || 0) * 100);
    }

    function render(state) {
      const endRate = percent(state.end_rate);
      overlay.classList.toggle("hidden", state.visible === false);
      endVotes.textContent = state.end_votes || 0;
      continueVotes.textContent = state.continue_votes || 0;
      validVotes.textContent = `有効 ${state.valid_votes || 0}票`;
      rate.textContent = `終了率 ${endRate}%`;
      bar.style.width = `${Math.max(0, Math.min(100, endRate))}%`;

      const minimumVotes = state.minimum_votes || 0;
      const threshold = percent(state.end_rate_threshold);
      if (state.threshold_met) {
        decision.classList.remove("wait");
        decision.textContent = "終了ライン到達";
      } else {
        decision.classList.add("wait");
        decision.textContent = `${minimumVotes}票以上 / ${threshold}%で終了ライン`;
      }
    }

    async function loadState() {
      try {
        const response = await fetch(`overlay_state.json?ts=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        render(await response.json());
      } catch (error) {
        decision.classList.add("wait");
        decision.textContent = "overlay_state.json待機中";
      }
    }

    loadState();
    setInterval(loadState, 1000);
  </script>
</body>
</html>
